services:
  - type: web
    name: polymarket-24-7-bot
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: DRY_RUN
        value: "true"
      - key: DAILY_PROFIT_TARGET_USD
        value: "3.0"
      - key: LOOP_INTERVAL_SECONDS
        value: "10"
      - key: ENABLE_HEALTH_SERVER
        value: "true"
